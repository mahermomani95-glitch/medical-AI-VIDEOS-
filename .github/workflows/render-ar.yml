name: Render Narrated Videos (Arabic)

# Manual trigger, or automatic whenever an Arabic script/scene changes.
# Narration is Arabic with medical terminology spoken in English, so this
# job downloads two Piper voices and the generator auto-switches between
# them per run of Arabic vs. Latin text within each line.

on:
  workflow_dispatch:
  push:
    paths:
      - "questions/*.ar.script.json"
      - "engine/out-ar/**"
      - "engine/generate_video_ar.py"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and piper-tts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet "piper-tts==1.2.0"

      - name: Download Arabic (male) and English (deep male) voice models
        run: |
          mkdir -p voices
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main"
          fetch() {
            curl -fSL -o "$1" "$2" || { echo "::error::Failed to download $1 from $2 (HTTP error)"; exit 1; }
          }
          fetch voices/ar_JO-kareem-medium.onnx      "$BASE/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx"
          fetch voices/ar_JO-kareem-medium.onnx.json "$BASE/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx.json"
          fetch voices/en_US-ryan-high.onnx          "$BASE/en/en_US/ryan/high/en_US-ryan-high.onnx"
          fetch voices/en_US-ryan-high.onnx.json     "$BASE/en/en_US/ryan/high/en_US-ryan-high.onnx.json"
          ls -la voices/
          MIN_BYTES=1000000
          for f in voices/ar_JO-kareem-medium.onnx voices/en_US-ryan-high.onnx; do
            SIZE=$(stat -c%s "$f")
            if [ "$SIZE" -lt "$MIN_BYTES" ]; then
              echo "::error::$f is only $SIZE bytes -- looks corrupt/truncated, not a real .onnx model"
              exit 1
            fi
          done

      - name: Sanity-check piper is on PATH
        run: |
          echo "PATH=$PATH"
          which piper || { echo "::error::'piper' executable not found on PATH after pip install"; exit 1; }
          piper --help >/tmp/piper_help.txt 2>&1 || { echo "::error::'piper --help' failed: $(tail -c 500 /tmp/piper_help.txt)"; exit 1; }
          echo "piper OK: $(which piper)"

      - name: Generate narrated video for each Arabic question
        run: |
          set -x
          mkdir -p render-ar-out
          for script in questions/*.ar.script.json; do
            id=$(basename "$script" .ar.script.json)
            echo "=== Rendering $id (Arabic) ==="
            python engine/generate_video_ar.py \
              "$script" \
              "engine/out-ar" \
              "voices/ar_JO-kareem-medium.onnx" \
              "voices/en_US-ryan-high.onnx" \
              "render-ar-out" 2>&1 | tee "/tmp/${id}.log"
            RC=${PIPESTATUS[0]}
            if [ "$RC" -ne 0 ]; then
              echo "::error::generate_video_ar.py failed for $id (exit $RC). Tail of output: $(tail -c 1500 "/tmp/${id}.log" | tr '\n' ' ')"
              exit 1
            fi
          done
        shell: bash

      - name: Upload finished videos
        uses: actions/upload-artifact@v4
        with:
          name: narrated-videos-ar
          path: render-ar-out/*.mp4
          if-no-files-found: error
