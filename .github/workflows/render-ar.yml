name: Render Narrated Videos (Arabic)

# Manual trigger, or automatic whenever an Arabic script/scene changes.
# Narration is Arabic with medical terminology spoken in English, so the
# generator auto-switches between an Arabic and an English edge-tts voice
# per run of Arabic vs. Latin text within each line. Uses edge-tts
# (Microsoft Edge's free neural TTS) instead of Piper -- Piper's only
# Arabic voice was judged very poor quality by the user; edge-tts's
# Arabic neural voices (user-approved: ar-EG-ShakirNeural, ar-JO-TaimNeural,
# ar-JO-SanaNeural) are dramatically better. Default voice below is
# ar-EG-ShakirNeural (first user pick) + en-US-ChristopherNeural -- swap
# the --voice arguments in the render step to try ar-JO-TaimNeural or a
# different English voice.

on:
  workflow_dispatch:
  push:
    paths:
      - "questions/*.ar.script.json"
      - "engine/out-ar/**"
      - "engine/generate_video_ar.py"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and edge-tts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet edge-tts

      - name: Sanity-check edge-tts is on PATH and reachable
        run: |
          echo "PATH=$PATH"
          which edge-tts || { echo "::error::'edge-tts' executable not found on PATH after pip install"; exit 1; }
          edge-tts --voice ar-EG-ShakirNeural --text "اختبار" --write-media /tmp/sanity.mp3 || { echo "::error::edge-tts sanity synth failed"; exit 1; }
          [ -s /tmp/sanity.mp3 ] || { echo "::error::edge-tts sanity synth produced an empty file"; exit 1; }
          echo "edge-tts OK: $(which edge-tts)"

      - name: Generate narrated video for each Arabic question
        run: |
          set -x
          mkdir -p render-ar-out
          for script in questions/*.ar.script.json; do
            id=$(basename "$script" .ar.script.json)
            echo "=== Rendering $id (Arabic) ==="
            python engine/generate_video_ar.py \
              "$script" \
              "engine/out-ar" \
              "ar-EG-ShakirNeural" \
              "en-US-ChristopherNeural" \
              "render-ar-out" 2>&1 | tee "/tmp/${id}.log"
            RC=${PIPESTATUS[0]}
            if [ "$RC" -ne 0 ]; then
              echo "::error::generate_video_ar.py failed for $id (exit $RC). Tail of output: $(tail -c 1500 "/tmp/${id}.log" | tr '\n' ' ')"
              exit 1
            fi
          done
        shell: bash

      - name: Upload finished videos
        uses: actions/upload-artifact@v4
        with:
          name: narrated-videos-ar
          path: render-ar-out/*.mp4
          if-no-files-found: error

      - name: Commit finished videos back to repo (artifact downloads are unreachable from the dev sandbox)
        if: success()
        continue-on-error: true
        run: |
          mkdir -p rendered
          cp render-ar-out/*.mp4 rendered/
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add rendered
          if git diff --cached --quiet; then
            echo "No video changes to commit."
            exit 0
          fi
          git commit -m "Rendered Arabic videos from run ${{ github.run_id }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push attempt $i failed, retrying..."
            sleep 3
          done

      - name: Commit debug logs back to repo (always, so they're readable outside Actions UI)
        if: always()
        continue-on-error: true  # best-effort diagnostics; a push race with a concurrent run shouldn't redden the job
        run: |
          mkdir -p debug-logs
          cp /tmp/*.log debug-logs/ 2>/dev/null || true
          if [ -z "$(ls -A debug-logs 2>/dev/null)" ]; then
            echo "No debug logs produced, nothing to commit."
            exit 0
          fi
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add debug-logs
          if git diff --cached --quiet; then
            echo "No log changes to commit."
            exit 0
          fi
          git commit -m "Debug log from run ${{ github.run_id }} (${{ job.status }})"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push attempt $i failed, retrying..."
            sleep 3
          done
