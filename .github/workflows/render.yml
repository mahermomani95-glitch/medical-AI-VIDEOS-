name: Render Narrated Videos

# Manual trigger, or automatic whenever a question/script changes.
# GitHub's runners have full internet access, so this step can reach
# Hugging Face for a real neural voice model -- something a locked-down
# sandbox can't do. That's the whole reason rendering happens here.

on:
  workflow_dispatch:
  push:
    paths:
      - "questions/**"
      - "engine/**"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and piper-tts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet "piper-tts==1.2.0"

      - name: Download deep male English voice model
        run: |
          mkdir -p voices
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main"
          curl -sL -o voices/en_US-ryan-high.onnx      "$BASE/en/en_US/ryan/high/en_US-ryan-high.onnx"
          curl -sL -o voices/en_US-ryan-high.onnx.json "$BASE/en/en_US/ryan/high/en_US-ryan-high.onnx.json"
          ls -la voices/

      - name: Generate narrated video for each question
        run: |
          mkdir -p render-out
          for script in questions/*.script.json; do
            id=$(basename "$script" .script.json)
            echo "=== Rendering $id ==="
            python engine/generate_video.py \
              "$script" \
              "engine/out" \
              "voices/en_US-ryan-high.onnx" \
              "render-out"
          done

      - name: Upload finished videos
        uses: actions/upload-artifact@v4
        with:
          name: narrated-videos
          path: render-out/*.mp4
          if-no-files-found: error
