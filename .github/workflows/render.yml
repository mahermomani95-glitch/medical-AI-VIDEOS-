name: Render Narrated Videos

# Manual trigger, or automatic whenever a question/script changes.
# GitHub's runners have full internet access, so this step can reach
# Hugging Face for a real neural voice model -- something a locked-down
# sandbox can't do. That's the whole reason rendering happens here.

on:
  workflow_dispatch:
  push:
    paths:
      - "questions/**"
      - "engine/**"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and piper-tts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet "piper-tts==1.2.0"

      - name: Download deep male English voice model
        run: |
          mkdir -p voices
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main"
          curl -fSL -o voices/en_US-ryan-high.onnx      "$BASE/en/en_US/ryan/high/en_US-ryan-high.onnx"      || { echo "::error::Failed to download en_US-ryan-high.onnx (HTTP error)"; exit 1; }
          curl -fSL -o voices/en_US-ryan-high.onnx.json "$BASE/en/en_US/ryan/high/en_US-ryan-high.onnx.json" || { echo "::error::Failed to download en_US-ryan-high.onnx.json (HTTP error)"; exit 1; }
          ls -la voices/
          MIN_BYTES=1000000
          SIZE=$(stat -c%s voices/en_US-ryan-high.onnx)
          if [ "$SIZE" -lt "$MIN_BYTES" ]; then
            echo "::error::Downloaded voice model is only $SIZE bytes -- looks corrupt/truncated, not a real .onnx model"
            cat voices/en_US-ryan-high.onnx
            exit 1
          fi

      - name: Sanity-check piper is on PATH
        run: |
          echo "PATH=$PATH"
          which piper || { echo "::error::'piper' executable not found on PATH after pip install"; exit 1; }
          piper --help >/tmp/piper_help.txt 2>&1 || { echo "::error::'piper --help' failed: $(tail -c 500 /tmp/piper_help.txt)"; exit 1; }
          echo "piper OK: $(which piper)"

      - name: Generate narrated video for each question
        run: |
          set -x
          mkdir -p render-out
          for script in questions/*.script.json; do
            case "$script" in
              *.ar.script.json) continue ;;  # Arabic-track scripts are handled by render-ar.yml, not this workflow
            esac
            id=$(basename "$script" .script.json)
            echo "=== Rendering $id ==="
            python engine/generate_video.py \
              "$script" \
              "engine/out" \
              "voices/en_US-ryan-high.onnx" \
              "render-out" 2>&1 | tee "/tmp/${id}.log"
            RC=${PIPESTATUS[0]}
            if [ "$RC" -ne 0 ]; then
              echo "::error::generate_video.py failed for $id (exit $RC). Tail of output: $(tail -c 1500 "/tmp/${id}.log" | tr '\n' ' ')"
              exit 1
            fi
          done
        shell: bash

      - name: Upload finished videos
        uses: actions/upload-artifact@v4
        with:
          name: narrated-videos
          path: render-out/*.mp4
          if-no-files-found: error

      - name: Commit debug logs back to repo (always, so they're readable outside Actions UI)
        if: always()
        run: |
          mkdir -p debug-logs
          cp /tmp/*.log debug-logs/ 2>/dev/null || true
          if [ -z "$(ls -A debug-logs 2>/dev/null)" ]; then
            echo "No debug logs produced, nothing to commit."
            exit 0
          fi
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add debug-logs
          if git diff --cached --quiet; then
            echo "No log changes to commit."
          else
            git commit -m "Debug log from run ${{ github.run_id }} (${{ job.status }})"
            git push
          fi
