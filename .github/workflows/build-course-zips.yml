name: Build Per-Course ZIPs

# Packs each course's videos into a single zip and attaches it to that
# course's Release, so a student can take a whole course in one download
# instead of tapping 54 files.
#
# One zip per course rather than one for everything: the full bank is several
# GB, which is a miserable download on a phone -- if it fails at 90% you start
# over. A ~150 MB course zip is recoverable, and iOS Files unzips it natively
# with no extra app.
#
# Runs in CI because the videos already live here; pulling several GB down to
# a laptop just to zip it back up would be pointless.

on:
  workflow_dispatch:
    inputs:
      course:
        description: "Course slug (e.g. 6mo2013). Blank = all courses."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.list.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          python3 - << 'PY' >> "$GITHUB_OUTPUT"
          import glob, json, os, re
          want = "${{ inputs.course }}".strip()
          slugs = set()
          for p in glob.glob("questions/*.ar.script.json"):
              m = re.match(r"surgery-(.+)-\d+$", os.path.basename(p)[:-len(".ar.script.json")])
              if m:
                  slugs.add(m.group(1))
          out = sorted(s for s in slugs if not want or s == want)
          print(f"slugs={json.dumps(out)}")
          PY

  zip:
    needs: plan
    if: ${{ needs.plan.outputs.slugs != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        slug: ${{ fromJson(needs.plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the folder name the catalog expects
        id: folder
        run: |
          # The offline catalog addresses videos by a relative path built from
          # the course's real name ("Surgery-12th-Month-2021"), NOT the slug.
          # Naming the folder after the slug produced a zip where nothing
          # played. Derive it from bank.json -- the same source the catalog
          # uses -- so the two cannot drift apart.
          python3 - << 'PY' >> "$GITHUB_OUTPUT"
          import json, re, sys
          sys.path.insert(0, "engine")
          from build_catalog import slug_course, safe_folder
          bank = json.load(open("questions/bank.json", encoding="utf-8"))
          want = "${{ matrix.slug }}"
          for rec in bank:
              if slug_course(rec["course"]) == want:
                  print(f"name={safe_folder(rec['course'])}")
                  break
          else:
              raise SystemExit(f"no course matches slug {want}")
          PY

      - name: Download this course's videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${{ steps.folder.outputs.name }}"
          # --pattern excludes any previously built zip; we only want the mp4s.
          gh release download "videos-${{ matrix.slug }}" \
            --repo "${{ github.repository }}" \
            --dir "${{ steps.folder.outputs.name }}" \
            --pattern '*-ar.mp4' --clobber
          echo "videos: $(ls "${{ steps.folder.outputs.name }}" | wc -l)"

      - name: Add the offline catalog and a readme
        run: |
          set -euo pipefail
          # The catalog sits BESIDE the course folder, not inside it: its paths
          # are "Surgery-.../video.mp4", so it has to be one level above.
          python3 engine/build_catalog.py questions/bank.json \
            "OPEN-ME-catalog.html" --offline
          cat > "README.txt" << 'EOF'
          Surgery Board Teaching Videos

          Open OPEN-ME-catalog.html to search the questions and play any
          video - it all works with no internet.

          Keep the catalog file NEXT TO the course folder, exactly as it comes
          out of the zip. The catalog lists every course, but only videos you
          have downloaded will play. To add more, unzip another course here so
          its folder sits alongside this one.

          On iPhone: tap the zip in the Files app to unzip it, then tap
          OPEN-ME-catalog.html.
          EOF

      - name: Zip it
        run: |
          set -euo pipefail
          # -0: the videos are already H.264, so compression only burns CPU.
          zip -0 -q -r "surgery-${{ matrix.slug }}-videos.zip" \
            "${{ steps.folder.outputs.name }}" OPEN-ME-catalog.html README.txt
          ls -lh "surgery-${{ matrix.slug }}-videos.zip"

      - name: Attach to the course Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "videos-${{ matrix.slug }}" \
            "surgery-${{ matrix.slug }}-videos.zip" \
            --repo "${{ github.repository }}" --clobber
