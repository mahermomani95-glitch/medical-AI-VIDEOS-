<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#07111F;--panel:#10243D;--text:#F5F8FC;--cyan:#55D6E8;--cyan2:#19C3B1;--amber:#FFB454;--muted:#7C93AC}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;overflow:hidden}
.scene{width:1920px;height:1080px;display:flex;flex-direction:column;justify-content:center;gap:36px;padding:90px 130px;background:radial-gradient(circle at 50% 15%,#10243D 0,#07111F 60%)}
.kicker{font-size:26px;color:var(--cyan);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.heading{font-size:56px;font-weight:800;line-height:1.12;max-width:1500px}
.caption{font-size:34px;line-height:1.4;color:var(--text);max-width:1600px;border-left:5px solid var(--cyan2);padding-left:26px}
.visual{margin-top:10px}
.visual svg{width:100%;max-width:1600px;height:auto;display:block}
.footer{position:absolute;left:80px;right:80px;bottom:50px;display:flex;justify-content:space-between;font-size:20px;color:var(--muted)}
.badge{display:inline-block;padding:6px 16px;border-radius:999px;border:1px solid var(--cyan);color:var(--cyan);font-size:18px;font-weight:700}
</style></head>
<body><div class="scene">
  <div class="kicker">Scene 2 of 7 · The Mechanism -- Why the Gut Goes Quiet After Surgery</div>
  <div class="caption">Postoperative ileus: surgical stress + sympathetic activation + inflammation + opioids slow the gut -- but not evenly</div>
  <div class="visual">
  <svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
    
    <g transform="translate(20,20)">
      <rect width="170" height="70" rx="14" fill="#10243D" stroke="#FFB454" stroke-width="2"/>
      <text x="85" y="32" text-anchor="middle" fill="#F5F8FC" font-size="15" font-weight="700">Surgical</text><text x="85" y="52" text-anchor="middle" fill="#F5F8FC" font-size="15" font-weight="700">handling</text>
    </g>
    <g transform="translate(220,20)">
      <rect width="170" height="70" rx="14" fill="#10243D" stroke="#FFB454" stroke-width="2"/>
      <text x="85" y="32" text-anchor="middle" fill="#F5F8FC" font-size="15" font-weight="700">Sympathetic</text><text x="85" y="52" text-anchor="middle" fill="#F5F8FC" font-size="15" font-weight="700">activation</text>
    </g>
    <g transform="translate(420,20)">
      <rect width="170" height="70" rx="14" fill="#10243D" stroke="#FFB454" stroke-width="2"/>
      <text x="85" y="32" text-anchor="middle" fill="#F5F8FC" font-size="15" font-weight="700">Inflammatory</text><text x="85" y="52" text-anchor="middle" fill="#F5F8FC" font-size="15" font-weight="700">mediators</text>
    </g>
    <g transform="translate(620,20)">
      <rect width="170" height="70" rx="14" fill="#10243D" stroke="#FFB454" stroke-width="2"/>
      <text x="85" y="32" text-anchor="middle" fill="#F5F8FC" font-size="15" font-weight="700">Opioid</text><text x="85" y="52" text-anchor="middle" fill="#F5F8FC" font-size="15" font-weight="700">analgesia</text>
    </g>
    <text x="450" y="130" text-anchor="middle" fill="#7C93AC" font-size="20">↓ all feed into ↓</text>
    <rect x="280" y="150" width="340" height="60" rx="30" fill="#10243D" stroke="#FFB454" stroke-width="3"/>
    <text x="450" y="187" text-anchor="middle" fill="#FFB454" font-size="22" font-weight="800">Postoperative Ileus</text>
    <text x="450" y="240" text-anchor="middle" fill="#55D6E8" font-size="17">but NOT uniform — each gut segment recovers on its own clock</text>
  </svg></div>
  <div class="footer"><span>Medical AI Videos — Single Narrator</span><span class="badge">surgery-6mo2013-01</span></div>
</div></body></html>
