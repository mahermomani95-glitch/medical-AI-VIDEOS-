<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#07111F;--panel:#10243D;--text:#F5F8FC;--cyan:#55D6E8;--cyan2:#19C3B1;--amber:#FFB454;--muted:#7C93AC}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;overflow:hidden}
.scene{width:1920px;height:1080px;display:flex;flex-direction:column;justify-content:center;gap:36px;padding:90px 130px;background:radial-gradient(circle at 50% 15%,#10243D 0,#07111F 60%)}
.kicker{font-size:26px;color:var(--cyan);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.heading{font-size:56px;font-weight:800;line-height:1.12;max-width:1500px}
.caption{font-size:34px;line-height:1.4;color:var(--text);max-width:1600px;border-left:5px solid var(--cyan2);padding-left:26px}
.visual{margin-top:10px}
.visual svg{width:100%;max-width:1600px;height:auto;display:block}
.footer{position:absolute;left:80px;right:80px;bottom:50px;display:flex;justify-content:space-between;font-size:20px;color:var(--muted)}
.badge{display:inline-block;padding:6px 16px;border-radius:999px;border:1px solid var(--cyan);color:var(--cyan);font-size:18px;font-weight:700}
</style></head>
<body><div class="scene">
  <div class="kicker">Scene 1 of 7 · Question</div>
  <div class="caption">What is the true order of GI recovery after abdominal surgery?</div>
  <div class="visual"><svg viewBox="0 0 660 270" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(0, 0)">
      <rect width="640" height="42" rx="10" fill="#10243D" stroke="#7C93AC" stroke-width="1.5" opacity="0.9"/>
      <text x="18" y="28" fill="#F5F8FC" font-size="18" font-weight="700">A.</text>
      <text x="55" y="28" fill="#F5F8FC" font-size="18">Stomach, then colon, then small bowel</text>
    </g>
    <g transform="translate(0, 52)">
      <rect width="640" height="42" rx="10" fill="#10243D" stroke="#7C93AC" stroke-width="1.5" opacity="0.9"/>
      <text x="18" y="28" fill="#F5F8FC" font-size="18" font-weight="700">B.</text>
      <text x="55" y="28" fill="#F5F8FC" font-size="18">Colon, then small bowel, then stomach</text>
    </g>
    <g transform="translate(0, 104)">
      <rect width="640" height="42" rx="10" fill="#10243D" stroke="#7C93AC" stroke-width="1.5" opacity="0.9"/>
      <text x="18" y="28" fill="#F5F8FC" font-size="18" font-weight="700">C.</text>
      <text x="55" y="28" fill="#F5F8FC" font-size="18">Stomach, then small bowel, then colon</text>
    </g>
    <g transform="translate(0, 156)">
      <rect width="640" height="42" rx="10" fill="#10243D" stroke="#7C93AC" stroke-width="1.5" opacity="0.9"/>
      <text x="18" y="28" fill="#F5F8FC" font-size="18" font-weight="700">D.</text>
      <text x="55" y="28" fill="#F5F8FC" font-size="18">Small bowel, then stomach, then colon</text>
    </g>
    <g transform="translate(0, 208)">
      <rect width="640" height="42" rx="10" fill="#10243D" stroke="#7C93AC" stroke-width="1.5" opacity="0.9"/>
      <text x="18" y="28" fill="#F5F8FC" font-size="18" font-weight="700">E.</text>
      <text x="55" y="28" fill="#F5F8FC" font-size="18">Small bowel, then colon, then stomach</text>
    </g></svg></div>
  <div class="footer"><span>Medical AI Videos — Single Narrator</span><span class="badge">surgery-6mo2013-01</span></div>
</div></body></html>
