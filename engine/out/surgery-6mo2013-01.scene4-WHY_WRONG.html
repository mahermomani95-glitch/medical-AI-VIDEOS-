<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#07111F;--panel:#10243D;--text:#F5F8FC;--cyan:#55D6E8;--cyan2:#19C3B1;--amber:#FFB454;--muted:#7C93AC}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;overflow:hidden}
.scene{width:1920px;height:1080px;display:flex;flex-direction:column;justify-content:center;gap:36px;padding:90px 130px;background:radial-gradient(circle at 50% 15%,#10243D 0,#07111F 60%)}
.kicker{font-size:26px;color:var(--cyan);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.heading{font-size:56px;font-weight:800;line-height:1.12;max-width:1500px}
.caption{font-size:34px;line-height:1.4;color:var(--text);max-width:1600px;border-left:5px solid var(--cyan2);padding-left:26px}
.visual{margin-top:10px}
.visual svg{width:100%;max-width:1600px;height:auto;display:block}
.footer{position:absolute;left:80px;right:80px;bottom:50px;display:flex;justify-content:space-between;font-size:20px;color:var(--muted)}
.badge{display:inline-block;padding:6px 16px;border-radius:999px;border:1px solid var(--cyan);color:var(--cyan);font-size:18px;font-weight:700}
</style></head>
<body><div class="scene">
  <div class="kicker">Scene 4 of 7 · Why A, B, C, and E Are Wrong</div>
  <div class="caption">A, B, C, E each misorder at least two of the three segments</div>
  <div class="visual"><svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(0, 0)">
      <rect width="860" height="52" rx="12" fill="#10243D" stroke="#FFB454" stroke-width="2" opacity="0.85"/>
      <text x="24" y="34" fill="#FFB454" font-size="22" font-weight="800">A</text>
      <text x="70" y="34" fill="#F5F8FC" font-size="19" font-weight="700">Stomach → Colon → Small bowel</text>
      <text x="850" y="34" text-anchor="end" fill="#7C93AC" font-size="15">Reverses the entire order</text>
    </g>
    <g transform="translate(0, 66)">
      <rect width="860" height="52" rx="12" fill="#10243D" stroke="#FFB454" stroke-width="2" opacity="0.85"/>
      <text x="24" y="34" fill="#FFB454" font-size="22" font-weight="800">B</text>
      <text x="70" y="34" fill="#F5F8FC" font-size="19" font-weight="700">Colon → Small bowel → Stomach</text>
      <text x="850" y="34" text-anchor="end" fill="#7C93AC" font-size="15">Colon is actually last, not first</text>
    </g>
    <g transform="translate(0, 132)">
      <rect width="860" height="52" rx="12" fill="#10243D" stroke="#FFB454" stroke-width="2" opacity="0.85"/>
      <text x="24" y="34" fill="#FFB454" font-size="22" font-weight="800">C</text>
      <text x="70" y="34" fill="#F5F8FC" font-size="19" font-weight="700">Stomach → Small bowel → Colon</text>
      <text x="850" y="34" text-anchor="end" fill="#7C93AC" font-size="15">Swaps the 1st and 2nd organs</text>
    </g>
    <g transform="translate(0, 198)">
      <rect width="860" height="52" rx="12" fill="#10243D" stroke="#FFB454" stroke-width="2" opacity="0.85"/>
      <text x="24" y="34" fill="#FFB454" font-size="22" font-weight="800">E</text>
      <text x="70" y="34" fill="#F5F8FC" font-size="19" font-weight="700">Small bowel → Colon → Stomach</text>
      <text x="850" y="34" text-anchor="end" fill="#7C93AC" font-size="15">Swaps the 2nd and 3rd organs</text>
    </g></svg></div>
  <div class="footer"><span>Medical AI Videos — Single Narrator</span><span class="badge">surgery-6mo2013-01</span></div>
</div></body></html>
